<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADSO - Login</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="assets/css/login.css">
<link rel="stylesheet" href="assets/css/sala.css">
</head>

<body>

<div class="fondo-sala" id="fondo-sala" aria-hidden="true"></div>

<header class="topbar d-flex justify-content-between align-items-center px-3 py-2">
    <div>SENA CEGAFE · Regional Boyacá · Tunja 2026</div>
    <div class="d-none d-md-block">Sistema de Gestión y Monitoreo Académico AVA</div>
</header>

<section class="hero position-relative overflow-hidden py-5">

    <div class="circle-left"></div>
    <div class="circle-right"></div>

    <div class="container position-relative">
        <div class="row align-items-stretch g-4">

            <div class="col-lg-6">
                <figure class="branding">
                    <img class="branding-sala" src="assets/img/SENA/salasistemas.jpeg"
                         alt="Sala de sistemas del SENA con aprendices en sus equipos intercambiando mensajes, código e imágenes">
                    <figcaption class="branding-texto">
                        <h1 class="mb-0">ADSO</h1>
                        <h2>Sena</h2>
                    </figcaption>
                </figure>
            </div>

            <div class="col-lg-6">
                <div class="login-card p-4 mx-auto">

                    <div class="card-title-sena mb-4">INGRESO DE USUARIOS</div>

                    <form id="login-form" novalidate autocomplete="off">

                        <div class="input-group mb-3">
                            <span class="input-group-text"><i class="fa-regular fa-id-card"></i></span>
                            <select id="doc_type" class="form-select">
                                <option value="">Doc de identidad</option>
                                <option value="CC">Cédula</option>
                                <option value="TI">Tarjeta de Identidad</option>
                                <option value="PA">Pasaporte</option>
                            </select>
                        </div>

                        <div class="input-group mb-3">
                            <span class="input-group-text"><i class="fa-regular fa-user"></i></span>
                            <input id="doc_num" type="text" class="form-control" placeholder="Número de documento">
                        </div>

                        <div class="input-group mb-3">
                            <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                            <input id="password" type="password" class="form-control" placeholder="Contraseña">
                        </div>

                        <div class="input-group mb-3">
                            <span class="input-group-text"><i class="fa-solid fa-user-tag"></i></span>
                            <select id="rol" class="form-select">
                                <option value="">Seleccione su rol</option>
                                <option value="aprendiz">Aprendiz</option>
                                <option value="instructor">Instructor</option>
                                <option value="administrador">Administrador</option>
                            </select>
                        </div>

                        <a href="#" class="forgot d-flex align-items-center gap-2 mb-3">
                            <i class="fa-solid fa-key"></i>
                            Olvidé mi contraseña
                        </a>

                        <p id="login-error" class="login-msg" role="alert"></p>

                        <button type="submit" class="btn btn-sena w-100">INGRESAR</button>

                    </form>

                </div>
            </div>

        </div>
    </div>

</section>

<footer class="footer d-flex align-items-center">
    <div class="sena-logo">SENA</div>
    <div class="pie-enlaces">
        <p class="pie-enlaces-titulo">Centro de Gestión Administrativa y Fortalecimiento Empresarial</p>
        <a class="pie-enlace" href="https://senacentrogestiontunja.blogspot.com/"
           target="_blank" rel="noopener noreferrer">
            <i class="fa-solid fa-arrow-up-right-from-square"></i>
            Blog del Centro de Gestión — SENA Tunja
        </a>
        <a class="pie-enlace" href="pages/bienvenida.html">
            <i class="fa-solid fa-circle-info"></i>
            Conoce la plataforma antes de entrar
        </a>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/estado/ficha.js"></script>
<script src="assets/js/autenticacion/nomina.js"></script>
<script src="assets/js/autenticacion/registro.js"></script>
<script src="assets/js/autenticacion/login.js"></script>
<script src="assets/js/infraestructura/animacion.js"></script>

</body>
</html>
